<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>满辰集团业绩看板</title>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      background: linear-gradient(135deg, #1a2940 0%, #1e3a5f 50%, #234b7a 100%);
      color: #e2e8f0;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ===== 顶栏 ===== */
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 32px;
      background: rgba(15, 23, 42, 0.92);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.3);
    }
    .topbar-left {
      display: flex;
      align-items: center;
      gap: 20px;
    }
    .logo-area {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .logo-dot {
      width: 10px; height: 10px;
      border-radius: 50%;
      background: #3b82f6;
      box-shadow: 0 0 14px rgba(59, 130, 246, 0.5);
    }
    .topbar h1 {
      font-size: 1.25rem;
      font-weight: 700;
      color: #e2e8f0;
      letter-spacing: 0.5px;
    }
    /* ===== 可编辑大标题 ===== */
    .editable-title {
      font-size: 1.35rem;
      font-weight: 700;
      color: #e2e8f0;
      border: none;
      background: transparent;
      outline: none;
      cursor: text;
      padding: 4px 8px;
      border-radius: 6px;
      transition: background 0.2s;
      font-family: inherit;
      min-width: 300px;
    }
    .editable-title:hover {
      background: rgba(255, 255, 255, 0.06);
    }
    .editable-title:focus {
      background: rgba(255, 255, 255, 0.1);
    }
    /* ===== 可编辑图表小标题 ===== */
    .chart-title-editable {
      border: none;
      background: transparent;
      outline: none;
      cursor: text;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 0.92rem;
      font-weight: 600;
      color: #e2e8f0;
      font-family: inherit;
      transition: background 0.2s;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .chart-title-editable:hover {
      background: rgba(255, 255, 255, 0.06);
    }
    .chart-title-editable:focus {
      background: rgba(255, 255, 255, 0.1);
    }
    .topbar-right {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    /* ===== 按钮 ===== */
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 16px;
      border-radius: 8px;
      font-size: 0.82rem;
      font-weight: 500;
      cursor: pointer;
      border: 1px solid rgba(255, 255, 255, 0.12);
      background: rgba(30, 41, 62, 0.7);
      color: #cbd5e1;
      transition: all 0.2s;
      white-space: nowrap;
      font-family: inherit;
    }
    .btn:hover {
      background: rgba(30, 41, 62, 0.95);
      border-color: rgba(255, 255, 255, 0.2);
      color: #f1f5f9;
    }
    .btn-primary {
      background: linear-gradient(135deg, #3b82f6, #2563eb);
      color: #fff;
      border: none;
    }
    .btn-primary:hover {
      background: linear-gradient(135deg, #60a5fa, #3b82f6);
      color: #fff;
    }
    .btn-success {
      background: linear-gradient(135deg, #22c55e, #16a34a);
      color: #fff;
      border: none;
    }
    .btn-success:hover {
      background: linear-gradient(135deg, #34d96e, #22c55e);
      color: #fff;
    }
    .btn-sm { padding: 5px 12px; font-size: 0.75rem; }
    #fileInput { display: none; }

    /* ===== 主体 ===== */
    .main {
      max-width: 1500px;
      margin: 0 auto;
      padding: 20px 32px;
    }

    /* ===== 概览卡片 ===== */
    .cards {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 14px;
      margin-bottom: 20px;
    }
    .card {
      background: rgba(15, 23, 42, 0.7);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      padding: 18px 22px;
      position: relative;
      overflow: hidden;
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.3);
    }
    .card::before {
      content: '';
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 3px;
    }
    .card:nth-child(1)::before { background: linear-gradient(90deg, #3b82f6, #60a5fa); }
    .card:nth-child(2)::before { background: linear-gradient(90deg, #22c55e, #4ade80); }
    .card:nth-child(3)::before { background: linear-gradient(90deg, #f59e0b, #fbbf24); }
    .card:nth-child(4)::before { background: linear-gradient(90deg, #ec4899, #f472b6); }
    .card-label {
      color: #94a3b8;
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 6px;
    }
    .card-value {
      font-size: 1.7rem;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }
    .card-value.blue { color: #60a5fa; }
    .card-value.green { color: #4ade80; }
    .card-value.amber { color: #fbbf24; }
    .card-value.pink { color: #f472b6; }

    /* ===== 双图面板 ===== */
    .chart-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-bottom: 20px;
    }
    .chart-panel {
      background: rgba(15, 23, 42, 0.7);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      padding: 18px 18px 10px 18px;
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.3);
    }
    .chart-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
      padding-bottom: 10px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }
    .chart-header h2 {
      font-size: 0.92rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
      color: #e2e8f0;
    }
    .chart-header .subtitle {
      color: #64748b;
      font-size: 0.72rem;
    }
    .chart-wrap {
      position: relative;
      width: 100%;
      height: 420px;
    }

    /* ===== 图例定制 ===== */
    .chart-legend-custom {
      display: flex;
      gap: 18px;
      justify-content: center;
      margin-top: 4px;
      padding-top: 8px;
      border-top: 1px solid rgba(59,130,246,0.05);
    }
    .legend-item {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.75rem;
      color: #64748b;
    }

    /* ===== 浮动按钮 ===== */
    .fab-btn {
      position: fixed;
      bottom: 28px;
      right: 28px;
      width: 48px; height: 48px;
      border-radius: 14px;
      background: linear-gradient(135deg, #3b82f6, #2563eb);
      color: #fff;
      border: none;
      font-size: 1.3rem;
      cursor: pointer;
      box-shadow: 0 4px 16px rgba(59, 130, 246, 0.35);
      transition: all 0.25s;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .fab-btn:hover {
      transform: scale(1.08);
      box-shadow: 0 6px 24px rgba(59, 130, 246, 0.5);
    }
    .fab-label {
      position: fixed;
      bottom: 80px;
      right: 28px;
      font-size: 0.72rem;
      color: #94a3b8;
      z-index: 100;
      pointer-events: none;
      text-align: center;
    }

    /* ===== 管理面板 ===== */
    .mgr-overlay {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.4);
      backdrop-filter: blur(4px);
      z-index: 998;
      opacity: 0;
      visibility: hidden;
      transition: all 0.3s;
    }
    .mgr-overlay.active {
      opacity: 1;
      visibility: visible;
    }
    .mgr-panel {
      position: fixed;
      top: 0; right: 0;
      width: 640px;
      max-width: 92vw;
      height: 100vh;
      background: #ffffff;
      border-left: 1px solid rgba(59, 130, 246, 0.1);
      z-index: 999;
      transform: translateX(100%);
      transition: transform 0.35s cubic-bezier(0.22, 1, 0.36, 1);
      display: flex;
      flex-direction: column;
      box-shadow: -8px 0 40px rgba(15, 23, 42, 0.15);
    }
    .mgr-panel.active {
      transform: translateX(0);
    }
    .mgr-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 18px 22px;
      border-bottom: 1px solid rgba(59, 130, 246, 0.08);
      flex-shrink: 0;
    }
    .mgr-header h3 { font-size: 1.05rem; font-weight: 600; color: #1e293b; }
    .mgr-close {
      background: none; border: none; color: #94a3b8;
      font-size: 1.6rem; cursor: pointer; padding: 2px 8px;
      border-radius: 6px; transition: all 0.2s; font-family: inherit;
    }
    .mgr-close:hover { background: rgba(0,0,0,0.04); color: #1e293b; }
    .mgr-body {
      flex: 1; overflow-y: auto; padding: 18px 22px;
    }
    .mgr-toolbar {
      display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px;
    }

    .mgr-table-wrap { overflow-x: auto; }
    .mgr-table-wrap table { width: 100%; border-collapse: collapse; }
    .mgr-table-wrap th {
      padding: 10px 12px; text-align: left; color: #64748b;
      font-weight: 600; font-size: 0.74rem; text-transform: uppercase;
      letter-spacing: 0.5px; border-bottom: 1px solid rgba(59,130,246,0.07);
      background: rgba(59,130,246,0.03); position: sticky; top: 0;
    }
    .mgr-table-wrap td {
      padding: 8px 12px; border-bottom: 1px solid rgba(59,130,246,0.04);
      font-size: 0.82rem; vertical-align: middle;
    }
    .mgr-table-wrap tr:hover td { background: rgba(59,130,246,0.02); }
    .mgr-table-wrap tr.total td {
      background: rgba(59,130,246,0.06);
      border-top: 2px solid rgba(59,130,246,0.12);
      font-weight: 700;
    }
    .edit-input {
      background: rgba(0,0,0,0.02);
      border: 1px solid transparent; border-radius: 4px;
      color: #1e293b; padding: 4px 8px; font-size: 0.82rem;
      width: 100%; outline: none; transition: border-color 0.2s; font-family: inherit;
    }
    .edit-input:hover { border-color: rgba(59,130,246,0.15); }
    .edit-input:focus { border-color: #3b82f6; background: rgba(59,130,246,0.04); }
    tr.total .edit-input { font-weight: 700; }
    .mgr-section-title {
      color: #64748b; font-size: 0.78rem; text-transform: uppercase;
      letter-spacing: 0.5px; margin: 18px 0 10px;
      padding-top: 14px; border-top: 1px solid rgba(59,130,246,0.06);
    }

    /* ===== Toast & Modal ===== */
    #toastContainer { position: fixed; top: 20px; right: 20px; z-index: 99999; }
    .toast {
      padding: 12px 24px; border-radius: 10px; font-size: 0.85rem;
      font-weight: 500; animation: slideIn 0.3s ease;
      box-shadow: 0 8px 24px rgba(0,0,0,0.15); margin-bottom: 8px;
    }
    .toast-success { background: #16a34a; color: #fff; }
    .toast-error { background: #dc2626; color: #fff; }
    .toast-info { background: #2563eb; color: #fff; }
    @keyframes slideIn { from { transform: translateX(100px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

    .modal-overlay {
      position: fixed; inset: 0;
      background: rgba(15, 23, 42, 0.5); backdrop-filter: blur(4px);
      display: flex; align-items: center; justify-content: center;
      z-index: 100000;
    }
    .modal-box {
      background: #ffffff; border: 1px solid rgba(59,130,246,0.12);
      border-radius: 14px; padding: 28px; width: 520px;
      max-width: 90vw; box-shadow: 0 24px 48px rgba(15, 23, 42, 0.2);
    }
    .modal-box h3 { font-size: 1.05rem; margin-bottom: 14px; color: #1e293b; }
    .modal-box p { color: #64748b; font-size: 0.84rem; margin-bottom: 12px; line-height: 1.5; }
    .modal-box textarea {
      width: 100%; height: 120px; background: rgba(0,0,0,0.02);
      border: 1px solid rgba(59,130,246,0.12); border-radius: 8px;
      color: #1e293b; padding: 12px; font-size: 0.8rem;
      font-family: 'Courier New', monospace; resize: vertical;
      outline: none; margin-bottom: 14px;
    }
    .modal-box textarea:focus { border-color: #3b82f6; }
    .modal-actions { display: flex; gap: 10px; justify-content: flex-end; }

    /* ===== 响应式 ===== */
    @media (max-width: 1100px) {
      .chart-row { grid-template-columns: 1fr; }
    }
    @media (max-width: 1000px) {
      .cards { grid-template-columns: repeat(2, 1fr); }
      .chart-wrap { height: 360px; }
    }
    @media (max-width: 700px) {
      .topbar { flex-direction: column; gap: 10px; padding: 12px 16px; }
      .topbar-left { flex-wrap: wrap; gap: 10px; }
      .main { padding: 14px; }
      .cards { grid-template-columns: 1fr; }
      .chart-wrap { height: 300px; }
      .mgr-panel { width: 100vw; max-width: 100vw; }
    }
  </style>
</head>
<body>

<!-- ===== 顶栏 ===== -->
<div class="topbar">
  <div class="topbar-left">
    <div class="logo-area">
      <div class="logo-dot"></div>
      <input class="editable-title" id="mainTitle" value="满辰集团 · 业绩看板 | 2026年度 · 6月" onblur="onMainTitleChange()">
    </div>
  </div>
  <div class="topbar-right">
    <button class="btn" onclick="syncNow()" title="从云端拉取最新数据">📥 检查更新</button>
    <button class="btn btn-primary" onclick="toggleMgrPanel()">⚙ 数据管理</button>
  </div>
</div>

<!-- ===== 主内容 ===== -->
<div class="main">
  <!-- 概览卡片 -->
  <div class="cards">
    <div class="card">
      <div style="display:flex;align-items:center;justify-content:space-between;gap:6px;margin-bottom:6px;">
        <span class="card-label" id="cardLabelTarget" style="margin-bottom:0;">6月目标总额</span>
        <input type="number" id="cardMonthInput" min="1" max="12" value="6" onchange="onCardMonthChange()"
               style="background:rgba(15,23,42,0.4);border:1px solid rgba(255,255,255,0.15);border-radius:4px;color:#60a5fa;padding:2px 4px;width:42px;text-align:center;outline:none;font-family:inherit;font-weight:600;font-size:0.85rem;">
      </div>
      <div class="card-value blue" id="totalTarget">¥0</div>
    </div>
    <div class="card">
      <div class="card-label">全年目标总进度</div>
      <div class="card-value green" id="totalAnnual">0%</div>
    </div>
    <div class="card">
      <div style="display:flex;align-items:center;justify-content:space-between;gap:6px;margin-bottom:6px;">
        <span class="card-label" id="cardLabelJun" style="margin-bottom:0;">6月目标总进度</span>
        <span style="color:#94a3b8;font-size:0.7rem;">↑ 改第 1 张卡</span>
      </div>
      <div class="card-value amber" id="totalJun">0%</div>
    </div>
    <div class="card">
      <div class="card-label">部门数量</div>
      <div class="card-value pink" id="deptCount">0</div>
    </div>
  </div>

  <!-- 双竖状柱形图 -->
  <div class="chart-row">
    <div class="chart-panel">
      <div class="chart-header">
        <input class="chart-title-editable" id="chartTitleAnnual" value="📅 全年目标进度" onblur="onChartTitleChange()">
      </div>
      <div class="chart-wrap">
        <canvas id="annualChart"></canvas>
      </div>
    </div>
    <div class="chart-panel">
      <div class="chart-header">
        <input class="chart-title-editable" id="chartTitleJun" value="📊 6月目标进度" onblur="onChartTitleChange()">
      </div>
      <div class="chart-wrap">
        <canvas id="junChart"></canvas>
      </div>
    </div>
  </div>
</div>

<!-- ===== 浮动按钮 ===== -->
<div class="fab-label">数据管理</div>
<button class="fab-btn" onclick="toggleMgrPanel()" title="数据管理">⚙</button>

<!-- ===== 管理面板遮罩 ===== -->
<div class="mgr-overlay" id="mgrOverlay" onclick="toggleMgrPanel()"></div>

<!-- ===== 管理面板 ===== -->
<div class="mgr-panel" id="mgrPanel">
  <div class="mgr-header">
    <h3>⚙ 数据管理</h3>
    <button class="mgr-close" onclick="toggleMgrPanel()">✕</button>
  </div>
  <div class="mgr-body">
    <div class="mgr-toolbar">
      <button class="btn btn-sm" onclick="document.getElementById('fileInput').click()">📂 上传数据</button>
      <input type="file" id="fileInput" accept=".json,.xlsx,.xls" onchange="handleFileUpload(event)">
      <button class="btn btn-sm" onclick="showSyncModal()">🔗 跨设备同步</button>
      <button class="btn btn-sm btn-success" onclick="exportData()">⬇ 导出数据</button>
      <button class="btn btn-sm btn-primary" onclick="saveToLocal()">💾 保存</button>
    </div>

    <div class="mgr-section-title">期间设置</div>
    <div style="display:flex;gap:16px;margin-bottom:14px;align-items:center;background:rgba(59,130,246,0.05);border:1px solid rgba(59,130,246,0.12);border-radius:8px;padding:12px 14px;">
      <label style="color:#475569;font-size:0.85rem;font-weight:500;">年份：
        <input type="number" id="yearInput" value="26" min="20" max="99" onchange="onConfigChange()"
               style="background:#ffffff;border:1px solid rgba(59,130,246,0.25);border-radius:6px;color:#1e293b;padding:6px 8px;width:70px;text-align:center;outline:none;font-family:inherit;font-weight:600;margin-left:4px;">
      </label>
      <label style="color:#475569;font-size:0.85rem;font-weight:500;">月份：
        <input type="number" id="monthInput" value="6" min="1" max="12" onchange="onConfigChange()"
               style="background:#ffffff;border:1px solid rgba(59,130,246,0.25);border-radius:6px;color:#1e293b;padding:6px 8px;width:70px;text-align:center;outline:none;font-family:inherit;font-weight:600;margin-left:4px;">
      </label>
      <span style="color:#94a3b8;font-size:0.75rem;margin-left:auto;">修改后表格表头与卡片标签自动联动</span>
    </div>

    <div class="mgr-section-title">跨设备同步</div>
    <div style="display:flex;gap:8px;margin-bottom:12px;">
      <button class="btn btn-sm" onclick="syncNow()">📥 检查更新</button>
      <button class="btn btn-sm btn-primary" onclick="pushToCloud()">📤 一键发布</button>
    </div>
    <div style="color:#94a3b8;font-size:0.75rem;line-height:1.5;margin-bottom:14px;">
      <strong>一键发布：</strong>点按钮 → 下载 data.json + 复制提示词<br>
      粘贴到 WorkBuddy 对话框 → 我部署后<br>
      <strong>其他设备自动更新 ⚡ 无需任何操作</strong>（每 2 分钟自动检测）
    </div>

    <div class="mgr-section-title">数据明细</div>
    <div style="display:flex;gap:8px;margin-bottom:10px;">
      <button class="btn btn-sm" onclick="addRow()">+ 添加部门</button>
      <button class="btn btn-sm" onclick="recalcTotal()">🔄 重算合计</button>
    </div>
    <div class="mgr-table-wrap">
      <table>
        <thead>
          <tr>
            <th style="width:120px">部门</th>
            <th id="thJunTarget" style="width:130px">6月目标金额</th>
            <th style="width:150px">全年目标进度</th>
            <th id="thJunProgress" style="width:150px">6月目标进度</th>
            <th style="width:40px"></th>
          </tr>
        </thead>
        <tbody id="tableBody"></tbody>
      </table>
    </div>
  </div>
</div>

<div id="toastContainer"></div>

<script>
// ============================================================
//  部门颜色映射
// ============================================================
const DEPT_COLORS = {
  '销售一部':     '#FF4757',
  '大客户部':     '#00B4D8',
  '税务师事务所': '#FF9F1C',
  '项目部前端':   '#22C55E',
  '项目部后端':   '#3B82F6',
  '财税顾问部':   '#A855F7',
  '会计部':       '#EC4899',
  '合规部':       '#FBBF24'
};
const COLOR_CYCLE = ['#FF4757','#00B4D8','#FF9F1C','#22C55E','#3B82F6','#A855F7','#EC4899','#FBBF24','#06B6D4','#F97316','#84CC16','#EAB308'];

function getDeptColor(deptName) {
  if (deptName === '合计') return '#60A5FA';
  if (DEPT_COLORS[deptName]) return DEPT_COLORS[deptName];
  const depts = Object.keys(DEPT_COLORS);
  const idx = depts.length % COLOR_CYCLE.length;
  const hex = COLOR_CYCLE[idx];
  DEPT_COLORS[deptName] = hex;
  return hex;
}

function hexToRgba(hex, alpha) {
  const r = parseInt(hex.slice(1,3), 16);
  const g = parseInt(hex.slice(3,5), 16);
  const b = parseInt(hex.slice(5,7), 16);
  return `rgba(${r},${g},${b},${alpha})`;
}

function validateData(data, sourceLabel) {
  if (!data || !data.data) return { valid: false, warnings: [] };
  const rows = data.data.filter(r => r.dept !== '合计');
  if (rows.length < 2) return { valid: true, warnings: [] };
  const warnings = [];
  const fieldChecks = [
    { key: 'jun', name: '6月目标进度' },
    { key: 'annual', name: '全年目标进度' }
  ];
  for (const f of fieldChecks) {
    const values = rows.map(r => r[f]).filter(v => v != null && !isNaN(v));
    if (values.length < 2) continue;
    const avgOfAll = values.reduce((s, v) => s + v, 0) / values.length;
    rows.forEach(r => {
      const v = r[f];
      if (v == null || isNaN(v)) return;
      if (v < 0.02 && avgOfAll > 0.1 && (avgOfAll / v) > 5) {
        warnings.push({ dept: r.dept, field: f.name, value: v, expected: avgOfAll, reason: '远低于其他部门平均水平' });
      }
      if (v > 10) {
        warnings.push({ dept: r.dept, field: f.name, value: v, expected: v / 100, reason: '看起来像百分比原值（如25代表25%），正确的值应为0.25' });
      }
    });
  }
  if (warnings.length > 0) {
    let msg = '⚠️ 数据异常提醒\n━━━━━━━━━━━━━━━━━\n';
    warnings.forEach(w => { msg += `🔴 ${w.dept} 的 ${w.field} = ${w.value}\n   原因：${w.reason}\n`; });
    msg += '\n请打开「数据管理」面板手动修正。';
    alert(msg);
    console.warn('[数据校验] 发现异常:', warnings);
  }
  return { valid: warnings.length === 0, warnings };
}

async function init() {
  const saved = localStorage.getItem('dashboardData');
  if (saved) {
    try { appData = JSON.parse(saved); validateData(appData, '本地缓存'); applyConfig(); renderAll(); startPolling(); return; } catch(e) {}
  }
  try {
    const res = await fetch('./data.json');
    if (res.ok) { appData = await res.json(); validateData(appData, '服务端'); applyConfig(); renderAll(); startPolling(); return; }
  } catch(e) {}
  appData = getDefaultData();
  applyConfig();
  renderAll();
  startPolling();
}

function applyConfig() {
  if (!appData.config) {
    appData.config = { title: '满辰集团 · 业绩看板', year: 26, month: 6, chartTitleAnnual: '📅 全年目标进度', chartTitleJun: '📊 6月目标进度' };
  }
  // 大标题：合并名称 + 年月
  const t = appData.config.title || '满辰集团 · 业绩看板';
  const y = String(appData.config.year || 26).padStart(2, '0');
  const m = appData.config.month || 6;
  document.getElementById('mainTitle').value = `${t} | 20${y}年度 · ${m}月`;
  // 图表小标题
  document.getElementById('chartTitleAnnual').value = appData.config.chartTitleAnnual || '📅 全年目标进度';
  document.getElementById('chartTitleJun').value = appData.config.chartTitleJun || '📊 6月目标进度';
  // 管理面板
  document.getElementById('yearInput').value = appData.config.year || 26;
  document.getElementById('monthInput').value = appData.config.month || 6;
  // 主面板月份输入
  if (document.getElementById('cardMonthInput')) {
    document.getElementById('cardMonthInput').value = appData.config.month || 6;
  }

  // 动态更新表格月份表头 & 卡片标签
  const mLabel = m + '月';
  document.getElementById('cardLabelTarget').textContent = mLabel + '目标总额';
  document.getElementById('cardLabelJun').textContent = mLabel + '目标总进度';
  if (document.getElementById('thJunTarget')) {
    document.getElementById('thJunTarget').textContent = mLabel + '目标金额';
  }
  if (document.getElementById('thJunProgress')) {
    document.getElementById('thJunProgress').textContent = mLabel + '目标进度';
  }
}

// 大标题编辑
function onMainTitleChange() {
  const val = document.getElementById('mainTitle').value.trim();
  if (!val) return;
  // 尝试解析出 title | 年份 · 月份
  const match = val.match(/^(.+?)\s*\|\s*20(\d{2})年度\s*·\s*(\d{1,2})月$/);
  if (match) {
    appData.config.title = match[1].trim();
    appData.config.year = parseInt(match[2]);
    appData.config.month = parseInt(match[3]);
  } else {
    appData.config.title = val;
  }
  applyConfig();
  renderAll();
  autoSave();
}

// ============================================================
//  共享柱形图配置
// ============================================================
function createDataLabelPlugin() {
  return {
    id: 'dataLabel',
    afterDraw(chart) {
      const ctx = chart.ctx;
      chart.data.datasets.forEach((dataset) => {
        const meta = chart.getDatasetMeta(0);
        meta.data.forEach((bar, index) => {
          const value = dataset.data[index];
          if (value == null || value === 0) return;
          const x = bar.x;
          const y = bar.y;
          ctx.save();
          ctx.textAlign = 'center';
          ctx.textBaseline = 'bottom';
          ctx.font = '600 11px -apple-system, "PingFang SC", sans-serif';
          ctx.fillStyle = '#e2e8f0';
          ctx.shadowColor = 'rgba(0,0,0,0.5)';
          ctx.shadowBlur = 4;
          ctx.fillText(value + '%', x, y - 3);
          ctx.restore();
        });
      });
    }
  };
}

function getChartOptions(dataValues) {
  const maxVal = Math.max(...dataValues);
  return {
    responsive: true,
    maintainAspectRatio: false,
    interaction: { mode: 'index', intersect: false },
    plugins: {
      legend: { display: false },
      tooltip: {
        backgroundColor: '#ffffff',
        titleColor: '#1e293b',
        bodyColor: '#64748b',
        borderColor: 'rgba(59,130,246,0.15)',
        borderWidth: 1,
        padding: 10,
        cornerRadius: 8,
        callbacks: {
          label: function(context) {
            return context.dataset.label + ': ' + context.raw + '%';
          }
        }
      }
    },
    scales: {
      x: {
        grid: { display: false },
        ticks: {
          color: '#94a3b8',
          font: { size: 11, weight: '500' },
          maxRotation: 0
        }
      },
      y: {
        beginAtZero: true,
        max: maxVal > 100 ? Math.ceil(maxVal * 1.2) : 100,
        grid: {
          color: 'rgba(255,255,255,0.06)',
          drawBorder: false
        },
        ticks: {
          color: '#94a3b8',
          font: { size: 10 },
          callback: function(value) { return value + '%'; }
        }
      }
    }
  };
}

function addRow() {
  const deptRows = appData.data.filter(r => r.dept !== '合计');
  const totalRows = appData.data.filter(r => r.dept === '合计');
  const newDept = { dept: '新部门', junTarget: 0, annual: 0, jun: 0 };
  appData.data = [...deptRows, newDept, ...totalRows];
  renderAll();
  autoSave();
  showToast('已添加新部门，请编辑名称和数据', 'info');
}

function deleteRow(idx) {
  const row = appData.data[idx];
  if (!row || row.dept === '合计') return;
  if (!confirm(`确定删除「${row.dept}」吗？`)) return;
  const deptRows = appData.data.filter(r => r.dept !== '合计');
  const totalRows = appData.data.filter(r => r.dept === '合计');
  const actualIdx = deptRows.findIndex(r => r.dept === row.dept);
  if (actualIdx >= 0) deptRows.splice(actualIdx, 1);
  appData.data = [...deptRows, ...totalRows];
  renderAll();
  autoSave();
  showToast('已删除「' + row.dept + '」', 'info');
}

function recalcTotal() {
  const deptRows = appData.data.filter(r => r.dept !== '合计');
  const totalRow = calcTotalRow();
  appData.data = [...deptRows, totalRow];
  renderAll();
  autoSave();
  showToast('合计行已重新计算（简单平均）', 'success');
}

function calcTotalRow() {
  const deptRows = appData.data.filter(r => r.dept !== '合计');
  const totalJunTarget = deptRows.reduce((s, r) => s + (r.junTarget || 0), 0);
  const totalAnnual = deptRows.reduce((s, r) => s + (r.annual || 0), 0);
  const totalJun = deptRows.reduce((s, r) => s + (r.jun || 0), 0);
  return {
    dept: '合计',
    junTarget: totalJunTarget,
    annual: deptRows.length ? totalAnnual / deptRows.length : 0,
    jun: deptRows.length ? totalJun / deptRows.length : 0
  };
}

function handleFileUpload(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  if (file.name.endsWith('.json')) {
    reader.onload = e => importData(e.target.result);
    reader.readAsText(file);
  } else {
    reader.onload = e => importExcel(e.target.result);
    reader.readAsArrayBuffer(file);
  }
  event.target.value = '';
}

function importData(jsonStr) {
  try {
    const data = JSON.parse(jsonStr);
    if (!data.data || !Array.isArray(data.data)) throw new Error('缺少 data 数组');
    const deptRows = data.data.filter(r => r.dept !== '合计');
    const totalRows = data.data.filter(r => r.dept === '合计');

    // 智能检测：如果 annual/jun 平均值 > 1，说明是百分比原值（31.32），需 ÷100
    function smartNormalize(rows, key) {
      const vals = rows.map(r => r[key]).filter(v => v != null && !isNaN(v));
      if (vals.length === 0) return false;
      return vals.reduce((s, v) => s + v, 0) / vals.length > 1;
    }
    const needDivAnnual = smartNormalize(deptRows, 'annual');
    const needDivJun = smartNormalize(deptRows, 'jun');
    if (needDivAnnual || needDivJun) {
      const allRows = [...deptRows, ...totalRows];
      allRows.forEach(r => {
        if (needDivAnnual && r.annual != null) r.annual = r.annual / 100;
        if (needDivJun && r.jun != null) r.jun = r.jun / 100;
      });
    }

    // 直接使用上传的数据（含合计行），不重新计算
    const mergedConfig = Object.assign(
      { title: '满辰集团 · 业绩看板', year: 26, month: 6, chartTitleAnnual: '📅 全年目标进度', chartTitleJun: '📊 6月目标进度' },
      appData.config || {},
      data.config || {}
    );
    appData = {
      config: mergedConfig,
      data: [...deptRows, ...totalRows],
      exportedAt: new Date().toISOString()
    };
    validateData(appData, 'JSON导入');
    applyConfig();
    renderAll();
    autoSave();
    showToast('数据导入成功！', 'success');
  } catch(e) {
    showToast('导入失败：' + e.message, 'error');
  }
}

function importExcel(arrayBuffer) {
  try {
    const workbook = XLSX.read(arrayBuffer, { type: 'array' });
    const sheet = workbook.Sheets[workbook.SheetNames[0]];
    const json = XLSX.utils.sheet_to_json(sheet, { header: 1 });
    let headerIdx = -1;
    for (let i = 0; i < json.length; i++) {
      const row = json[i];
      if (!row || !row.length) continue;
      const joined = row.map(String).join(' ');
      if (/部门|dept/i.test(joined) && /目标|target/i.test(joined)) { headerIdx = i; break; }
    }
    if (headerIdx === -1) throw new Error('未找到表头行（需包含「部门」「目标」等列名）');
    const headers = json[headerIdx].map(h => String(h).trim());
    const deptCol = headers.findIndex(h => /部门|dept/i.test(h));
    if (deptCol === -1) throw new Error('未找到「部门」列');
    const targetCol = headers.findIndex(h => /目标|金额|target/i.test(h));
    const annualCol = headers.findIndex(h => /全年|年度|annual/i.test(h));
    // 必须在表头同时匹配「月份/当月 + 进度」，避免误匹配「6月目标」金额列
    // 支持：1-12月 / 当月 / 本月 / jun / jul / current month
    const junCol = headers.findIndex(h => {
      if (!/(进度|完成率)/.test(h)) return false;
      return /(当月|本月|当前月|jun|cur)/i.test(h) || /\d{1,2}月/.test(h);
    });
    if (junCol === -1) throw new Error('未找到「X月目标进度」列（表头需包含「X月」+「进度」或「当月进度」等）');

    // 先收集原始值（包括合计行）
    const rawAnnuals = [];
    const rawJuns = [];
    const newData = [];
    const totalRows = [];
    for (let i = headerIdx + 1; i < json.length; i++) {
      const row = json[i];
      if (!row || !row[deptCol]) continue;
      const dept = String(row[deptCol]).trim();
      if (!dept) continue;
      const isTotal = /合计|total|sum/i.test(dept);
      const rawAnnual = annualCol >= 0 ? (parseFloat(row[annualCol]) || 0) : 0;
      const rawJun = junCol >= 0 ? (parseFloat(row[junCol]) || 0) : 0;
      const entry = {
        dept,
        junTarget: targetCol >= 0 ? (parseFloat(row[targetCol]) || 0) : 0,
        annual: rawAnnual,
        jun: rawJun
      };
      if (isTotal) {
        totalRows.push(entry);
      } else {
        rawAnnuals.push(rawAnnual);
        rawJuns.push(rawJun);
        newData.push(entry);
      }
    }
    if (newData.length === 0) throw new Error('未解析到任何部门数据');

    // 智能检测：Excel 百分比格式已自动转为小数，纯数字才是百分比原值
    // 如果平均值 > 1，说明是百分比原值（31.32 代表 31.32%），需 ÷100
    function smartNormalize(values) {
      if (values.length === 0) return false;
      const avg = values.reduce((s, v) => s + v, 0) / values.length;
      return avg > 1;
    }
    const needDivAnnual = smartNormalize(rawAnnuals);
    const needDivJun = smartNormalize(rawJuns);
    if (needDivAnnual || needDivJun) {
      const allRows = [...newData, ...totalRows];
      allRows.forEach(r => {
        if (needDivAnnual) r.annual = r.annual / 100;
        if (needDivJun) r.jun = r.jun / 100;
      });
    }

    // 直接使用 Excel 中的数据（含合计行），不重新计算
    appData = {
      config: Object.assign(
        { title: '满辰集团 · 业绩看板', year: 26, month: 6, chartTitleAnnual: '📅 全年目标进度', chartTitleJun: '📊 6月目标进度' },
        appData.config || {}
      ),
      data: [...newData, ...totalRows],
      exportedAt: new Date().toISOString()
    };
    validateData(appData, 'Excel导入');
    applyConfig();
    renderAll();
    autoSave();
    showToast(`Excel 导入成功！共 ${newData.length} 个部门`, 'success');
  } catch(e) {
    showToast('Excel 导入失败：' + e.message, 'error');
  }
}
//  导出 & 跨端同步
// ============================================================
function exportData() {
  const blob = new Blob([JSON.stringify(appData, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `业绩看板数据_${appData.config.year || '26'}_${String(appData.config.month || '6').padStart(2,'0')}.json`;
  a.click();
  URL.revokeObjectURL(url);
  showToast('数据已导出', 'success');
}

function showSyncModal() {
  const old = document.querySelector('.modal-overlay');
  if (old) old.remove();
  const syncPackage = btoa(unescape(encodeURIComponent(JSON.stringify(appData))));
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.innerHTML = `
    <div class="modal-box" onclick="event.stopPropagation()">
      <h3>🔗 跨设备同步</h3>
      <p><strong>导出同步码：</strong>复制下方代码，在另一台设备上粘贴导入。</p>
      <textarea id="syncCode" readonly>${syncPackage}</textarea>
      <button class="btn btn-sm" onclick="copySyncCode()" style="margin-bottom:14px">📋 复制同步码</button>
      <p><strong>导入同步码：</strong>粘贴从其他设备复制的同步码。</p>
      <textarea id="importCode" placeholder="在此粘贴同步码..."></textarea>
      <div class="modal-actions">
        <button class="btn" onclick="closeModal()">取消</button>
        <button class="btn btn-primary" onclick="importSync()">导入同步</button>
      </div>
    </div>
  `;
  overlay.onclick = () => overlay.remove();
  document.body.appendChild(overlay);
}

function copySyncCode() {
  const ta = document.getElementById('syncCode');
  ta.select();
  navigator.clipboard.writeText(ta.value).then(() => showToast('同步码已复制到剪贴板', 'success'))
    .catch(() => { document.execCommand('copy'); showToast('同步码已复制', 'success'); });
}

function importSync() {
  const code = document.getElementById('importCode').value.trim();
  if (!code) { showToast('请先粘贴同步码', 'error'); return; }
  try {
    const jsonStr = decodeURIComponent(escape(atob(code)));
    const data = JSON.parse(jsonStr);
    if (!data.data || !Array.isArray(data.data)) throw new Error('无效数据格式');
    appData = data;
    validateData(appData, '跨端同步');
    applyConfig();
    renderAll();
    autoSave();
    closeModal();
    showToast('跨设备同步成功！', 'success');
  } catch(e) { showToast('同步码无效：' + e.message, 'error'); }
}

function closeModal() { const el = document.querySelector('.modal-overlay'); if (el) el.remove(); }

function saveToLocal() {
  localStorage.setItem('dashboardData', JSON.stringify(appData));
  showToast('数据已保存到本地浏览器', 'success');
}

// ============================================================
//  跨设备同步（一键发布 + 大屏自动检测）
// ============================================================
let syncLastExported = '';
let syncTimer = null;

// 从 data.json 拉取云端最新数据
async function checkCloudUpdate(quiet) {
  try {
    const res = await fetch('./data.json?_=' + Date.now());
    if (!res.ok) return false;
    const remote = await res.json();
    if (!remote || !remote.exportedAt) return false;
    if (remote.exportedAt === syncLastExported) return false;
    // 云端有更新
    syncLastExported = remote.exportedAt;
    const oldConfig = appData ? (appData.config || {}) : {};
    appData = {
      config: Object.assign({}, remote.config || {}, {
        title: oldConfig.title || (remote.config && remote.config.title) || '满辰集团 · 业绩看板',
        year: oldConfig.year || (remote.config && remote.config.year) || 26,
        month: oldConfig.month || (remote.config && remote.config.month) || 6,
        chartTitleAnnual: oldConfig.chartTitleAnnual || (remote.config && remote.config.chartTitleAnnual) || '📅 全年目标进度',
        chartTitleJun: oldConfig.chartTitleJun || (remote.config && remote.config.chartTitleJun) || '📊 6月目标进度',
      }),
      data: remote.data || getDefaultData().data,
      exportedAt: remote.exportedAt
    };
    applyConfig();
    renderAll();
    localStorage.setItem('dashboardData', JSON.stringify(appData));
    return true;
  } catch(e) {
    return false;
  }
}

// 手动检查更新
async function syncNow() {
  showToast('正在检查云端数据...', 'info');
  const updated = await checkCloudUpdate();
  if (updated) {
    showToast('✅ 已获取跨设备更新数据', 'success');
  } else {
    showToast('当前已是最新数据', 'info');
  }
}

// 大屏端自动检测（每 120 秒，积分消耗极低：30次/小时）
function startPolling() {
  if (syncTimer) clearInterval(syncTimer);
  syncLastExported = appData && appData.exportedAt ? appData.exportedAt : '';
  syncTimer = setInterval(() => checkCloudUpdate(true), 120000);
}

// 一键发布：导出 JSON + 复制提示词，粘贴给 WorkBuddy 即可部署
function pushToCloud() {
  // ⚠️ 更新时间戳，确保其他设备能检测到变化
  appData.exportedAt = new Date().toISOString();
  localStorage.setItem('dashboardData', JSON.stringify(appData));

  // 导出 data.json
  const blob = new Blob([JSON.stringify(appData, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'data.json';
  a.click();
  URL.revokeObjectURL(url);

  // 2. 复制提示词到剪贴板
  const prompt = `【一键部署】业绩看板数据已更新，附件 data.json 已下载。
请帮我：
1. 用附件 data.json 替换项目目录中的 data.json
2. 重新部署到 CloudStudio
完成部署后提醒我`;

  navigator.clipboard.writeText(prompt).then(() => {
    showToast('✅ 文件已下载 + 提示词已复制到剪贴板，粘贴给我即可部署！', 'success');
  }).catch(() => {
    // fallback
    showToast('✅ 文件已下载！请复制下方提示词发给 WorkBuddy', 'info');
    setTimeout(() => {
      // 用 textarea 辅助复制
      const ta = document.createElement('textarea');
      ta.value = prompt;
      ta.style.position = 'fixed';
      ta.style.left = '-9999px';
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
    }, 500);
  });
}

// 本地持久化
function autoSave() { 
  localStorage.setItem('dashboardData', JSON.stringify(appData)); 
}

function showToast(msg, type = 'info') {
  const container = document.getElementById('toastContainer');
  const el = document.createElement('div');
  el.className = `toast toast-${type}`;
  el.textContent = msg;
  container.appendChild(el);
  setTimeout(() => { el.style.opacity = '0'; el.style.transition = 'opacity 0.3s'; setTimeout(() => el.remove(), 300); }, 3000);
}

init();
</script>
